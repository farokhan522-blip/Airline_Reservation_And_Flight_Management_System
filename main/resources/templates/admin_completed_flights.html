<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight History | SkyAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #0f172a; font-family: 'Inter', sans-serif; color: #f8fafc; }
        .history-card { 
            background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px; margin-bottom: 20px; transition: 0.3s;
        }
        .history-card:hover { transform: translateY(-3px); background: rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="p-5">
    <div class="container">
        
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <a th:href="@{/admin}" class="text-decoration-none text-secondary fw-bold">
                    <i class="fas fa-arrow-left me-2"></i> Back to Dashboard
                </a>
                <h2 class="fw-bold mt-2 text-success">Completed Flights History</h2>
                <p class="text-muted">Archive of successfully landed flights</p>
            </div>
            <div class="text-success opacity-50"><i class="fas fa-clipboard-check fa-4x"></i></div>
        </div>

        <div class="row">
            <div th:each="f : ${flights}" class="col-12">
                <div class="history-card p-4 d-flex justify-content-between align-items-center">
                    
                    <div>
                        <span class="badge bg-success mb-2">COMPLETED</span>
                        <h4 class="fw-bold mb-1" th:text="${f.flightId}">PK-101</h4>
                        <span class="text-muted" th:text="${f.airline.name}">Airline</span>
                    </div>

                    <div class="text-center px-5">
                        <div class="d-flex align-items-center gap-3">
                            <h3 class="fw-bold m-0" th:text="${f.source}">SRC</h3>
                            <i class="fas fa-plane text-success"></i>
                            <h3 class="fw-bold m-0" th:text="${f.destination}">DST</h3>
                        </div>
                    </div>

                    <div class="text-end">
                        <p class="mb-0 fw-bold"><i class="far fa-calendar-alt me-2"></i><span th:text="${f.date}"></span></p>
                        <small class="text-muted"><i class="far fa-clock me-2"></i><span th:text="${f.time}"></span></small>
                    </div>

                </div>
            </div>

            <div th:if="${flights.isEmpty()}" class="text-center py-5">
                <h4 class="text-muted">No flight history available.</h4>
            </div>
        </div>

    </div>
</body>
</html>
