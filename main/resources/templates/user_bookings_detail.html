<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>My Bookings | SkyTravels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; 
        
            background-image: url('/images/bookingdet.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }
    
        .header-mini { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 0 0 25px 25px; }
        .glass-card { background: white; border-radius: 20px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); border: none; }
        .badge-wait { background: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .badge-confirm { background: #d1f7e8; color: #007d4b; border: 1px solid #b2f2d8; }
    </style>
</head>
<body>
    <div class="header-mini text-center mb-5 shadow">
        <h2 class="fw-bold"><i class="fas fa-ticket-alt me-2"></i> My Active Bookings</h2>
        <a href="/user_dashboard" class="btn btn-sm btn-outline-light rounded-pill px-4 mt-2">Back to Hub</a>
    </div>
    <div class="container">
        <div class="glass-card">
            <table class="table align-middle">
                <thead class="table-light">
                    <tr><th>Flight</th><th>Route</th><th>Status</th><th>Date</th></tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${bookings}">
                        <td class="fw-bold text-primary" th:text="${b.flight.flightId}"></td>
                        <td th:text="${b.flight.source + ' ➔ ' + b.flight.destination}"></td>
                        <td>
                            <span class="badge rounded-pill px-3 py-2" 
                                  th:classappend="${b.status.name() == 'CONFIRMED' ? 'badge-confirm' : 'badge-wait'}"
                                  th:text="${b.status}"></span>
                        </td>
                        <td th:text="${b.bookingDate}"></td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${bookings.isEmpty()}" class="text-center py-5 text-muted">No active bookings found.</div>
        </div>
    </div>
</body>
</html>
