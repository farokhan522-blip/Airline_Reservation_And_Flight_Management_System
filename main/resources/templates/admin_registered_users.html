<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Registered Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; padding: 30px;
            background-image: url('/images/REGpassengers.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-5 rounded shadow">
        <div class="d-flex justify-content-between mb-4">
            <h2 class="text-primary"><i class="fas fa-users"></i> Registered Passengers</h2>
            <a href="/admin" class="btn btn-outline-secondary">Back to Dashboard</a>
        </div>

        <table class="table table-hover">
            <thead class="table-dark">
                <tr><th>ID</th><th>Full Name</th><th>Email</th><th>Passport</th><th>Age</th></tr>
            </thead>
            <tbody>
                <tr th:each="p : ${passengers}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.fullName}" class="fw-bold"></td>
                    <td th:text="${p.email}"></td>
                    <td th:text="${p.passportNumber}"></td>
                    <td th:text="${p.age}"></td>
                </tr>
            </tbody>
        </table>
        <div th:if="${passengers.isEmpty()}" class="text-center text-muted mt-4">No registered users found.</div>
    </div>
</body>
</html>
