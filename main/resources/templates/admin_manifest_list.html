<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight Manifests | SkyAdmin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; padding: 30px;
            background-image: url('/images/manifest.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-5 rounded shadow">
        <div class="d-flex justify-content-between mb-4">
            <h2 class="fw-bold">📋 Flight Manifest Directory</h2>
            <a href="/admin" class="btn btn-outline-dark">Back to Dashboard</a>
        </div>
        <table class="table table-hover align-middle">
            <thead class="table-dark">
                <tr>
                    <th>Flight ID</th>
                    <th>Route</th>
                    <th>Date/Time</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="f : ${flights}">
                    <td th:text="${f.flightId}" class="fw-bold"></td>
                    <td th:text="${f.source} + ' ➔ ' + ${f.destination}"></td>
                    <td th:text="${f.date} + ' ' + ${f.time}"></td>
                    <td>
                        <a th:href="@{'/admin/manifest/view/' + ${f.flightId}}" class="btn btn-sm btn-primary">
                            <i class="fas fa-users me-1"></i> View Booked Passengers
                        </a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
