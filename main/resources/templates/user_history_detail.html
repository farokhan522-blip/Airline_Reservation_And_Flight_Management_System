<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Travel History | SkyTravels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; 
            background-image: url('/images/travelhist.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        }
    
        .header-mini { background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%); color: white; padding: 30px; border-radius: 0 0 25px 25px; }
        .history-item { background: white; border-radius: 15px; padding: 20px; margin-bottom: 15px; transition: 0.3s; border-left: 5px solid #11998e; }
        .history-item:hover { transform: translateX(10px); }
    </style>
</head>
<body>
    <div class="header-mini text-center mb-5 shadow">
        <h2 class="fw-bold"><i class="fas fa-history me-2"></i> Journey Logs</h2>
        <a href="/user_dashboard" class="btn btn-sm btn-outline-light rounded-pill px-4 mt-2">Back to Hub</a>
    </div>
    <div class="container">
        <div th:each="h : ${history}" class="history-item shadow-sm d-flex justify-content-between align-items-center">
            <div>
                <h6 class="fw-bold m-0" th:text="${h.flight.source + ' to ' + h.flight.destination}"></h6>
                <small class="text-muted" th:text="'Flight ID: ' + ${h.flight.flightId}"></small>
            </div>
            <div class="text-end">
                <span class="badge bg-light text-success border d-block mb-1">COMPLETED</span>
                <small class="text-muted" th:text="${h.bookingDate}"></small>
            </div>
        </div>
        <div th:if="${history.isEmpty()}" class="text-center py-5 text-muted">No past journeys recorded.</div>
    </div>
</body>
</html>
