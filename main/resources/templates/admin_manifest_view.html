<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Flight Manifest View</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; padding: 30px;
            background-image: url('/images/manifest table.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        background-repeat: no-repeat;
        }
    </style>
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-5 rounded shadow">
        <div class="d-flex justify-content-between mb-4 border-bottom pb-3">
            <div>
                <h2 class="text-success fw-bold"><i class="fas fa-list-check me-2"></i> Flight Manifest</h2>
                <h5 class="text-muted" th:text="'Flight ID: ' + ${flight.flightId}"></h5>
            </div>
            <a href="/admin/manifest/flights" class="btn btn-outline-dark h-50">Back to List</a>
        </div>

        <table class="table table-striped">
            <thead class="table-success">
                <tr>
                    <th>#</th>
                    <th>Full Name</th>
                    <th>Age</th>
                    <th>Passport ID</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p, iter : ${passengers}">
                    <td th:text="${iter.index + 1}"></td>
                    <td th:text="${p.fullName}" class="fw-bold"></td>
                    <td th:text="${p.age}"></td>
                    <td th:text="${p.passportNumber}"></td>
                    <td><span class="badge bg-success">CONFIRMED</span></td>
                </tr>
            </tbody>
        </table>

        <div th:if="${passengers.isEmpty()}" class="text-center py-5">
            <i class="fas fa-user-slash fa-3x text-muted mb-3"></i>
            <h5 class="text-muted">No passengers booked for this flight.</h5>
        </div>
    </div>
</body>
</html>
