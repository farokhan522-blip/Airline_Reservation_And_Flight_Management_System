<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Payments | SkyTravels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7fe; }
        .header-mini { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 30px; border-radius: 0 0 25px 25px; }
        .payment-card { background: white; border-radius: 20px; padding: 25px; border: none; }
    </style>
</head>
<body>
    <div class="header-mini text-center mb-5 shadow">
        <h2 class="fw-bold"><i class="fas fa-wallet me-2"></i> Transaction History</h2>
        <a href="/user_dashboard" class="btn btn-sm btn-outline-light rounded-pill px-4 mt-2">Back to Hub</a>
    </div>
    <div class="container">
        <div class="payment-card shadow-sm">
            <table class="table table-hover">
                <thead class="table-light">
                    <tr><th>Ref ID</th><th>Amount</th><th>Method</th><th>Date</th></tr>
                </thead>
                <tbody>
                    <tr th:each="p : ${payments}">
                        <td th:text="'#PAY-' + ${p.paymentID}" class="fw-bold"></td>
                        <td class="text-success fw-bold" th:text="'$' + ${p.amount}"></td>
                        <td><span class="badge bg-info bg-opacity-10 text-info">Credit Card</span></td>
                        <td th:text="${p.paymentDate}"></td>
                    </tr>
                </tbody>
            </table>
            <div th:if="${payments.isEmpty()}" class="text-center py-5 text-muted">No payment records available.</div>
        </div>
    </div>
</body>
</html>
